<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>The Last Story HD — Dionixu's Launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:"TLS Cinzel";src:url(fonts/Cinzel.ttf) format("truetype");font-weight:400 900}
@font-face{font-family:"TLS Cormorant";src:url(fonts/CormorantGaramond.ttf) format("truetype");font-weight:300 700}
@font-face{font-family:"TLS Cormorant";src:url(fonts/CormorantGaramond-Italic.ttf) format("truetype");font-weight:300 700;font-style:italic}
:root{
  --ink:#2e261c; --ink-2:#3b3126; --ink-soft:#5d4e3a; --line:#8c7656; --line-soft:rgba(140,118,86,.45);
  --paper:#f1e5cc; --paper-hi:rgba(250,243,228,.55); --panel:rgba(247,239,221,.92);
  --blue:#3e5873; --blue-d:#34495f; --blue-l:#4b6680; --gold:#c7a96a; --cream:#f8f1e1;
  --display:"TLS Cinzel","Cinzel","Trajan Pro",Georgia,serif;
  --body:"TLS Cormorant","Cormorant Garamond",Garamond,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0a07;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;overflow:hidden;flex:none;transform-origin:center center;
  background:var(--paper) url(assets/parchment.jpg) center/cover;font-family:var(--body);color:var(--ink)}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.abs{position:absolute}
.drag{position:absolute;left:0;top:0;right:150px;height:46px;z-index:5}
#dragbar{position:fixed;left:0;top:0;height:40px;z-index:50;-webkit-app-region:drag}
body.fs #dragbar{display:none}
body.fs .winbtns{display:none}
.iconbtn.focus{background:rgba(62,88,115,.16);box-shadow:0 0 0 2px var(--gold) inset}
#stage.barzone .mi.on{filter:saturate(.55) brightness(.92)}
#dragbar{position:fixed;left:0;top:0;height:40px;z-index:50;-webkit-app-region:drag}
.frame1{position:absolute;inset:14px;border:1px solid var(--line);pointer-events:none}
.frame2{position:absolute;inset:19px;border:1px solid rgba(140,118,86,.55);pointer-events:none}
.corner{position:absolute;width:44px;height:44px;pointer-events:none}
.winbtns{position:absolute;top:26px;right:40px;display:flex;gap:6px;z-index:6}
.iconbtn{width:36px;height:32px;border:0;background:transparent;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{background:rgba(62,88,115,.14)}
#art,#artfx{position:absolute;left:448px;top:31px;width:799px;height:662px;pointer-events:none}
#artfx{display:none}
#stage.gl #artfx{display:block}
#stage.gl #art{visibility:hidden}
#logo{position:absolute;left:62px;top:8px;width:386px;height:263px;pointer-events:none}

/* Menu principal */
#menu{position:absolute;left:44px;top:298px;width:372px;display:flex;flex-direction:column;gap:9px}
.mi{position:relative;height:34px;border:0;text-align:left;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:2.4px;cursor:pointer;
  margin-left:24px;padding:0 0 0 52px;color:#33291e;background:rgba(250,243,228,.35);border-top:1px solid var(--line);border-bottom:1px solid var(--line);transition:color .15s}
.mi .orn{position:absolute;top:10px}
.mi .orn.l{left:8px}.mi .orn.r{right:8px}
.mi .star{display:none}
.mi.on{margin-left:0;padding-left:82px;border:0;color:var(--cream);
  background:linear-gradient(90deg,var(--blue-d) 0%,var(--blue-l) 62%,rgba(75,102,128,0) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.25)}
.mi.on .orn{display:none}
.mi.on .star{display:block;position:absolute;left:8px;top:-5px}

.kicker{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:2px;color:#33291e;border-bottom:1px solid #a38c69;padding-bottom:4px}

/* Paneles */
.panel{position:absolute;left:44px;top:262px;padding:18px 22px;border:1px solid var(--line);outline:1px solid var(--line-soft);outline-offset:3px;
  background:var(--panel);display:none;flex-direction:column;gap:10px}
.panel.show{display:flex}
.phead{display:flex;align-items:center;justify-content:space-between;gap:16px}
.phead h2{margin:0;font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:3px;color:#33291e}
.back{border:1px solid var(--line);background:transparent;font-family:var(--display);font-size:12px;letter-spacing:1.5px;color:#33291e;padding:6px 12px;cursor:pointer}
.back:hover{background:rgba(62,88,115,.12)}
.scroll{overflow-y:auto;padding-right:4px}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#b9a47f;border-radius:4px}
.row{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:12px;padding:6px 6px 8px;border-bottom:1px solid rgba(140,118,86,.35)}
.row.focus{background:rgba(62,88,115,.08);box-shadow:inset 3px 0 0 var(--blue)}
.row .lbl{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:1.2px;color:#33291e}
.row .hint{display:block;font-size:13px;font-style:italic;color:#6a5a44}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:32px;padding:4px 14px;border:1px solid #a38c69;background:transparent;color:#33291e;font-family:var(--body);font-size:15px;font-weight:600;cursor:pointer}
.opt:hover{background:rgba(62,88,115,.12)}
.opt.on{border-color:var(--blue-d);background:var(--blue);color:var(--cream)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding-bottom:6px}
.tab{flex:1;padding:7px 6px;border:1px solid transparent;background:transparent;font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:1.4px;color:#6a5a44;cursor:pointer}
.tab:hover{color:#33291e;background:rgba(62,88,115,.08)}
.tab.on{color:var(--cream);background:var(--blue);border-color:var(--blue-d)}
.tab.focus{box-shadow:0 0 0 2px var(--gold)}
.grp{font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:2.2px;color:var(--blue);padding:8px 6px 2px;border-bottom:1px dashed rgba(140,118,86,.4)}
.note{margin:0;font-size:13.5px;font-style:italic;color:var(--ink-soft)}

.ach-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.ach{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid rgba(140,118,86,.5);background:rgba(255,250,238,.6)}
.badge{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(140,118,86,.18);border:2px solid #b9a47f}
.ach.got .badge{background:var(--blue);border-color:var(--gold);box-shadow:0 0 10px 1px rgba(216,180,106,.55)}
.badge img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.ach:not(.got) .badge img{filter:sepia(.5) saturate(.6) opacity(.75)}
.ach.got{background:rgba(255,248,226,.85);border-color:rgba(184,150,90,.8)}
.ach.focus{box-shadow:0 0 0 2px var(--gold)}
.ach .when{font-size:12.5px;font-style:italic;color:var(--blue);margin-top:2px}
.ach .mini{height:4px;margin-top:5px;background:rgba(140,118,86,.25)}
.ach .mini>div{height:100%;background:var(--blue)}
.ach .prog{font-family:var(--display);font-size:10.5px;letter-spacing:1px;color:#6a5a44;margin-top:2px}
.ach.new{animation:achNew 1.6s ease-out}
@keyframes achNew{0%{box-shadow:0 0 0 0 rgba(216,180,106,.9)}100%{box-shadow:0 0 0 14px rgba(216,180,106,0)}}
.ach .t{font-family:var(--display);font-size:12.5px;font-weight:600}
.ach .d{font-size:14px;line-height:1.2;color:#4f4232}
.ach .pts{flex:none;font-family:var(--display);font-size:13px;font-weight:700;color:var(--blue)}
.bar{height:6px;background:rgba(140,118,86,.25);border:1px solid rgba(140,118,86,.5)}
.bar>div{height:100%;background:var(--blue);width:0}

.credit{display:flex;flex-direction:column;padding-bottom:8px;border-bottom:1px solid rgba(140,118,86,.35)}
.credit .r{font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:1.6px;color:#6a5a44}
.credit .w{font-size:17px;font-weight:600}

#bottom{position:absolute;right:40px;bottom:30px;display:flex;gap:4px;padding:4px 8px;border-top:1px solid var(--line)}
/* ===== Intro estilo FFXIII ===== */
#motes{position:absolute;inset:0;pointer-events:none;z-index:1}
#beams{position:absolute;inset:-120px;pointer-events:none;z-index:2;opacity:0;mix-blend-mode:screen;filter:blur(10px);
  background:repeating-linear-gradient(118deg,rgba(255,248,228,0) 0 90px,rgba(255,248,228,.28) 135px,rgba(255,248,228,0) 190px 340px)}
#stage.beams-on #beams{animation:beamsIn 5.5s ease-out forwards, beamsDrift 18s 5.5s ease-in-out infinite alternate}
@keyframes beamsIn{0%{opacity:0;transform:translateX(-260px)}35%{opacity:.95}100%{opacity:.22;transform:translateX(60px)}}
@keyframes beamsDrift{from{transform:translateX(60px)}to{transform:translateX(-40px)}}
#dim{position:absolute;inset:0;background:#07060a;opacity:0;pointer-events:none;z-index:60;transition:opacity 2.4s cubic-bezier(.3,.1,.2,1)}
#stage.boot #dim{opacity:.9;transition:none}
#stage .rv{transition:opacity .9s ease, transform 1s cubic-bezier(.2,.8,.2,1), filter 1.2s ease}
#stage.boot .rv{opacity:0}
#stage.boot #logo{transform:scale(1.04);filter:brightness(2.2) blur(6px)}
#stage.boot #art,#stage.boot #artfx{transform:scale(1.035)}
#stage #art,#stage #artfx{transition:transform 7s cubic-bezier(.2,.7,.2,1), opacity 1.2s ease}
#stage.boot .mi{opacity:0;transform:translateX(-36px)}
#stage .mi{transition:opacity .55s ease, transform .7s cubic-bezier(.2,.8,.2,1), color .15s}
#stage.boot #bottom,#stage.boot .winbtns,#stage.boot #hints{opacity:0;transform:translateY(10px)}
#bottom,.winbtns,#hints{transition:opacity .8s ease, transform .8s ease}

#intro{position:absolute;inset:0;z-index:100;background:#000;overflow:hidden;cursor:pointer}
#intro.out{background:transparent;transition:background .8s ease}
#intro.gone{display:none}
#fx{position:absolute;inset:0;z-index:3;pointer-events:none}
#splash{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;opacity:0;
  background:#efe4cc url(assets/parchment.jpg) center/cover;transition:opacity 1.4s ease}
#splash::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(20,14,6,.55) 100%)}
#splash img{width:780px;mix-blend-mode:multiply;opacity:0;transform:scale(1.09);filter:blur(16px) brightness(2);
  transition:opacity 1.8s ease, transform 3.6s cubic-bezier(.15,.7,.2,1), filter 2s ease}
#intro.p-splash #splash{opacity:1}
#intro.p-splash #splash img{opacity:1;transform:scale(1);filter:blur(0) brightness(1)}
#intro.p-hold #splash img{transform:scale(1.035);transition:transform 3s linear}
#flare{position:absolute;left:50%;top:50%;width:0;height:3px;z-index:4;transform:translate(-50%,-50%);opacity:0;border-radius:50%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,247,225,.95) 48%,#fff 50%,rgba(255,247,225,.95) 52%,rgba(255,255,255,0));
  box-shadow:0 0 18px 4px rgba(255,236,190,.55),0 0 60px 10px rgba(255,220,160,.25)}
#flare.go{animation:flare 1.25s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes flare{0%{width:0;opacity:0}25%{opacity:1}70%{width:1500px;opacity:.85}100%{width:1700px;opacity:0}}
#flare.v{width:3px;height:0}
#flare.v.go{animation:flareV 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes flareV{0%{height:0;opacity:0}30%{opacity:1}100%{height:900px;opacity:0}}
#flash{position:absolute;inset:0;z-index:5;background:#fffaf0;opacity:0;pointer-events:none}
#flash.on{opacity:.95;transition:opacity .28s ease-in}
#flash.off{opacity:0;transition:opacity 1.1s ease-out}
#skip{position:absolute;right:42px;bottom:30px;z-index:6;font-family:var(--display);font-size:11px;letter-spacing:2.5px;color:rgba(255,245,225,.55);opacity:0;transition:opacity 1s 1s}
#intro.p-splash #skip{opacity:1;color:rgba(60,46,30,.6)}
#leave{position:absolute;inset:0;z-index:200;background:#000;opacity:0;pointer-events:none;transition:opacity .7s ease}
#leave.on{opacity:1;pointer-events:auto}
#leave.quick{transition:opacity .32s ease-in}
/* barra de volumen */
.slider{display:flex;align-items:center;gap:12px;width:100%;max-width:330px}
.slider .track{position:relative;flex:1;height:10px;border:1px solid #a38c69;background:rgba(255,252,244,.7);box-shadow:inset 0 1px 2px rgba(60,45,25,.18);touch-action:none}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--blue-d),var(--blue-l))}
.slider .knob{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;transform:rotate(45deg);background:var(--cream);border:1px solid var(--blue-d);box-shadow:0 1px 3px rgba(40,30,15,.35)}
.slider .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(140,118,86,.35) calc(10% - 1px) 10%);pointer-events:none}
.slider .val{min-width:48px;text-align:right;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:1px;color:#33291e}
.row.focus .slider .knob{box-shadow:0 0 0 3px rgba(216,180,106,.6),0 1px 3px rgba(40,30,15,.35)}
#toast{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);padding:10px 22px;background:var(--blue-d);color:var(--cream);
  font-family:var(--display);font-size:13px;letter-spacing:1.5px;border:1px solid var(--gold);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
/* idioma del launcher */
#langPanel{left:auto;right:40px;top:auto;bottom:74px;width:230px;padding:14px 16px;gap:8px;z-index:20;box-shadow:0 10px 30px rgba(40,30,15,.25)}
#langList{display:flex;flex-direction:column;gap:4px}
.langopt{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 12px;border:1px solid transparent;background:transparent;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:1.5px;color:#33291e;cursor:pointer;text-align:left}
.langopt:hover,.langopt.focus{border-color:var(--gold);background:rgba(62,88,115,.08)}
.langopt.on{background:var(--blue);color:var(--cream);border-color:var(--blue-d)}
.langopt.on::after{content:"✓";font-size:13px}
/* controles */
.opt.key{min-width:150px;font-family:var(--display);font-size:13px;letter-spacing:1px;background:rgba(255,252,244,.8);box-shadow:inset 0 -2px 0 rgba(140,118,86,.35)}
.opt.key.static{display:inline-flex;align-items:center;justify-content:center;cursor:default}
.opt.key.wait{border-color:var(--gold);color:var(--blue);font-family:var(--body);font-style:italic;font-size:14px;letter-spacing:0;animation:keyWait 1s ease-in-out infinite}
@keyframes keyWait{50%{box-shadow:0 0 0 3px rgba(216,180,106,.55)}}
.ralogin{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;padding:6px 2px}
.ralogin label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-size:11px;letter-spacing:1.5px;color:#5d4e3a}
.ralogin input{width:220px;height:34px;padding:0 10px;border:1px solid #a38c69;background:rgba(255,252,244,.85);font-family:var(--body);font-size:16px;color:#2e261c;outline:none}
.ralogin input:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(216,180,106,.5)}
.ralogin .opt{height:34px}
.ralogin .note{flex-basis:100%}
#hints{position:absolute;left:52px;bottom:30px;font-size:13px;font-style:italic;color:var(--ink-soft)}
/* cursor con la estética del juego (solo launcher y diálogo de salida) */
html,body,*{cursor:-webkit-image-set(url(assets/cursor/normal.png) 1x,url(assets/cursor/normal@2x.png) 2x) 2 2,default!important}
button,button *,a,.opt,.tab,.mi,.mi *,.langopt,.langopt *,.iconbtn,.iconbtn *,.back,.ach,.ach *,#intro{cursor:-webkit-image-set(url(assets/cursor/hover.png) 1x,url(assets/cursor/hover@2x.png) 2x) 2 2,pointer!important}
.opt:disabled,.opt.static{cursor:-webkit-image-set(url(assets/cursor/normal.png) 1x,url(assets/cursor/normal@2x.png) 2x) 2 2,default!important}
html.padmode,html.padmode *,html.padmode #intro{cursor:none!important}
</style>
</head>
<body>
<div id="dragbar"></div>
<div id="stage">
  <img id="art" src="assets/art.png" alt="">
  <canvas id="artfx" width="1043" height="865"></canvas>
  <canvas id="motes" width="1280" height="720"></canvas>
  <div id="beams"></div>
  <div class="frame1"></div><div class="frame2"></div>
  <svg class="corner" style="left:0;top:0" viewBox="0 0 44 44" aria-hidden="true"><g fill="none" stroke="#7a6548" stroke-width="1.1"><circle cx="17" cy="17" r="9"/><path d="M17 2 L19.5 14.5 L32 17 L19.5 19.5 L17 32 L14.5 19.5 L2 17 L14.5 14.5 Z"/><path d="M7 7 L27 27 M27 7 L7 27" stroke-width=".6"/></g></svg>
  <svg class="corner" style="right:0;top:0" viewBox="0 0 44 44" aria-hidden="true"><g fill="none" stroke="#7a6548" stroke-width="1.1"><circle cx="27" cy="17" r="9"/><path d="M27 2 L29.5 14.5 L42 17 L29.5 19.5 L27 32 L24.5 19.5 L12 17 L24.5 14.5 Z"/><path d="M17 7 L37 27 M37 7 L17 27" stroke-width=".6"/></g></svg>
  <svg class="corner" style="left:0;bottom:0" viewBox="0 0 44 44" aria-hidden="true"><g fill="none" stroke="#7a6548" stroke-width="1.1"><circle cx="17" cy="27" r="9"/><path d="M17 12 L19.5 24.5 L32 27 L19.5 29.5 L17 42 L14.5 29.5 L2 27 L14.5 24.5 Z"/><path d="M7 17 L27 37 M27 17 L7 37" stroke-width=".6"/></g></svg>
  <svg class="corner" style="right:0;bottom:0" viewBox="0 0 44 44" aria-hidden="true"><g fill="none" stroke="#7a6548" stroke-width="1.1"><circle cx="27" cy="27" r="9"/><path d="M27 12 L29.5 24.5 L42 27 L29.5 29.5 L27 42 L24.5 29.5 L12 27 L24.5 24.5 Z"/><path d="M17 17 L37 37 M37 17 L17 37" stroke-width=".6"/></g></svg>

  <div class="drag" id="drag"></div>
  <div class="winbtns">
    <button class="iconbtn" id="bMin" aria-label="Minimizar"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 7h12" stroke="#3b3126" stroke-width="1.3"/></svg></button>
    <button class="iconbtn" id="bClose" aria-label="Cerrar"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="#3b3126" stroke-width="1.3"/></svg></button>
  </div>

  <img id="logo" class="rv" src="assets/logo.png" alt="The Last Story">

  <!-- Principal -->
  <div id="mainScreen">
    <nav id="menu" aria-label="Menú principal"></nav>
  </div>

  <!-- Ajustes -->
  <section class="panel" id="settings" style="width:660px;height:418px;top:252px" aria-label="Ajustes">
    <div class="phead"><h2 data-t="settings">AJUSTES</h2><button class="back" data-back data-t="back">VOLVER</button></div>
    <div class="tabs" id="setTabs" role="tablist"></div>
    <div class="scroll" id="settingsRows" style="display:flex;flex-direction:column;gap:4px"></div>
    <p class="note" data-t="setNote"></p>
  </section>

  <!-- Logros -->
  <section class="panel" id="logros" style="width:760px;height:436px;top:252px" aria-label="Logros">
    <div class="phead">
      <div><h2 data-t="ach">LOGROS</h2><span class="note" data-t="achSub"></span></div>
      <div style="display:flex;align-items:center;gap:18px">
        <div style="text-align:right"><div id="achCount" style="font-family:var(--display);font-size:18px;font-weight:700;color:var(--blue)">0 / 109</div><div id="achPts" class="note" style="font-style:normal">0 / 800 puntos</div></div>
        <button class="back" id="achTest" data-t="achTest" data-tt="achTestTip">VER AVISO</button>
        <button class="back" data-back data-t="back">VOLVER</button>
      </div>
    </div>
    <div class="bar"><div id="achBar"></div></div>
    <div class="tabs" id="achTabs" role="tablist"></div>
    <p class="note" id="achNote" style="display:none"></p>
    <div class="scroll ach-grid" id="achGrid"></div>
  </section>

  <!-- Creditos -->
  <section class="panel" id="credits" style="width:500px;height:430px" aria-label="Créditos">
    <div class="phead"><h2 data-t="credits">CRÉDITOS</h2><button class="back" data-back data-t="back">VOLVER</button></div>
    <div class="scroll" id="creditList" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <div id="hints">Mando: ✚ / stick para moverte · A aceptar · B volver · F11 pantalla completa</div>

  <div id="bottom">

<script>
(() => {
  const host = window.tlsHost || (window.chrome && window.chrome.webview ? window.chrome.webview : null);

  // ---------- escala del escenario 1280x720 a la ventana

  const S = {

    achSub: L('Set de RetroAchievements (carlosrhv y Quenthel) · sin conexión', 'RetroAchievements set (carlosrhv & Quenthel) · offline', 'Set RetroAchievements (carlosrhv et Quenthel) · hors ligne'),
    points: L('puntos', 'points', 'points'), achAll: L('TODOS', 'ALL', 'TOUS'), achGot: L('CONSEGUIDOS', 'UNLOCKED', 'DÉBLOQUÉS'), achTodo: L('PENDIENTES', 'LOCKED', 'VERROUILLÉS'),
    achTest: L('VER AVISO', 'PREVIEW', 'APERÇU'), achTestTip: L('Muestra cómo se ve el aviso dentro del juego', 'Shows how the in-game notification looks', 'Montre à quoi ressemble la notification en jeu'),

    raLogin: L('Iniciando sesión…', 'Signing in…', 'Connexion…'), raSet: L('Descargando el set…', 'Downloading the set…', 'Téléchargement du set…'),

    resetDone: L('Controles restablecidos', 'Controls reset', 'Commandes réinitialisées'),

    credits_btn: L('BOTONES XBOX 360', 'XBOX 360 BUTTONS', 'BOUTONS XBOX 360'), credits_ach: L('SET DE LOGROS', 'ACHIEVEMENT SET', 'SET DE SUCCÈS'),

  };
  const t = (k, ...a) => { let s = tx(S[k]); if (s == null) return k; return s.replace(/\{(\d)\}/g, (_, i) => a[i]); };

  // ---------- estado
  const DEFAULTS = { voice: 'en', text: 'en', res: '1080', fps: '30', mode: 'full', hd: 'on', buttons: 'auto', vsync: 'on', music: 'on', intro: 'on', sfx: 'on', wind: 'on',
    gfx_shadows: 'off', gfx_grading: 'off', gfx_dof: 'off', gfx_rays: 'off', gvol: '100', mvol: '70', achievements: 'on', achToast: 'on', achSound: 'on', ui: 'es',
    kbCam: 'mouse', kbSens: '2', kbInvert: 'off', padInvert: 'off', lastInput: 'pad' };
  let cfg = Object.assign({}, DEFAULTS);
  let caps = { gameJpOk: false, fps60Ok: false, musicOk: true, dolphinOk: true, gameEnOk: true };
  let screen = 'main', sel = 0, rowSel = 0, busy = false, zone = 'menu', barSel = 0, langSel = 0;
  const BAR = ['bLang', 'bPad', 'bFull', 'bMusic'];
  const paintBar = () => { BAR.forEach((id, i) => $(id).classList.toggle('focus', zone === 'bar' && i === barSel)); $('stage').classList.toggle('barzone', zone === 'bar'); };

  const toast = (txt, ms) => { const el = $('toast'); el.textContent = txt; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), ms || 2800); };
  let saveT = null;
  const save = () => { clearTimeout(saveT); saveT = setTimeout(() => send('save', { config: cfg }), 120); };

  // ---------- música
  const music = $('music');
  const musicVol = () => 0.65 * Math.max(0, Math.min(100, parseInt(cfg.mvol || '70', 10))) / 100;
  const syncMusic = () => {
    if (cfg.music === 'on' && caps.musicOk && screen !== 'playing') { music.volume = musicVol(); music.play().catch(() => {}); }
    else music.pause();
  };

  // ---------- efectos de sonido del juego (SE_UICOM)
  const SFX = {};
  ['move', 'tick', 'ok', 'back', 'start'].forEach((n) => { SFX[n] = Array.from({ length: 3 }, () => { const a = new Audio('assets/sfx/' + n + '.ogg'); a.preload = 'auto'; return a; }); });
  const VOL = { move: 0.32, tick: 0.3, ok: 0.38, back: 0.34, start: 0.45 };
  let sfxI = 0, lastSfx = 0;
  const sfx = (n) => {
    if (cfg.sfx === 'off' || !SFX[n] || screen === 'playing') return;
    const now = performance.now(); if (n === 'move' && now - lastSfx < 45) return; lastSfx = now;
    const a = SFX[n][sfxI++ % 3]; try { a.currentTime = 0; a.volume = VOL[n]; a.play().catch(() => {}); } catch (e) {}
  };

  // ---------- salir: fundido a negro breve (música incluida)
  let quitting = false;
  const quitApp = () => {
    if (!host) { toast(t('bye')); return; }
    if (quitting) return; quitting = true;
    const lv = $('leave'); lv.classList.add('quick', 'on');
    const v0 = music.volume; let k = 0;
    const f = setInterval(() => { k++; music.volume = Math.max(0, v0 * (1 - k / 7)); if (k >= 7) clearInterval(f); }, 45);
    setTimeout(() => send('close'), 340);
  };

  // ---------- dispositivo de entrada activo (icono de la barra)
  const ICON_PAD = '<svg width="22" height="20" viewBox="0 0 26 20" fill="none" stroke="#2e261c" stroke-width="1.8"><path d="M7 4h12c3 0 5 4 6 9s-1 6-3 5-3-4-5-4H9c-2 0-3 3-5 4s-4 0-3-5 3-9 6-9z"/><path d="M7 8v4M5 10h4"/></svg>';
  const ICON_KB = '<svg width="26" height="20" viewBox="0 0 30 20" fill="none" stroke="#2e261c" stroke-width="1.6"><rect x="1" y="5" width="19" height="11" rx="1.5"/><path d="M4 8.5h1.5M7.5 8.5H9M11 8.5h1.5M14.5 8.5H16M4 12.5h1M6.5 12.5h8M16 12.5h1"/><rect x="22.5" y="5" width="6.5" height="11" rx="3.2"/><path d="M25.75 5v4"/></svg>';
  let inputDev = 'pad', mouseAt = null;
  const setInput = (d) => {
    document.documentElement.classList.toggle('padmode', d === 'pad');   // con mando no se ve el cursor
    if (d === inputDev) return; inputDev = d;
    $('bPad').innerHTML = d === 'kb' ? ICON_KB : ICON_PAD;
    $('bPad').setAttribute('aria-label', d === 'kb' ? 'Teclado y ratón' : 'Mando');
    $('hints').textContent = t(d === 'kb' ? 'hintsKb' : 'hintsPad');
    if (cfg.lastInput !== d) { cfg.lastInput = d; save(); }
  };
  document.documentElement.classList.add('padmode');
  addEventListener('mousemove', (e) => { if (!mouseAt) { mouseAt = [e.screenX, e.screenY]; return; } if (Math.abs(e.screenX - mouseAt[0]) + Math.abs(e.screenY - mouseAt[1]) > 12) setInput('kb'); mouseAt = [e.screenX, e.screenY]; }, true);
  addEventListener('mousedown', () => setInput('kb'), true);
  addEventListener('wheel', () => setInput('kb'), true);

  // ---------- menú principal
  const ITEMS = [
    { k: 'play', run: () => play() },
    { k: 'settings', run: () => go('settings') },
    { k: 'ach', run: () => go('logros') },
    { k: 'credits', run: () => go('credits') },
    { k: 'exit', run: () => quitApp() }

  const ORN_L = '<svg class="orn l" width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><path d="M1 7 L8 3 L11 7 L8 11 Z M11 7 L21 7" fill="none" stroke="#7a6548"/></svg>';
  const ORN_R = '<svg class="orn r" width="22" height="14" viewBox="0 0 22 14" aria-hidden="true"><path d="M21 7 L14 3 L11 7 L14 11 Z M11 7 L1 7" fill="none" stroke="#7a6548"/></svg>';
  const STAR = '<svg class="star" width="62" height="44" viewBox="0 0 62 44" aria-hidden="true"><g fill="#f4ead3" stroke="#5a4a35" stroke-width=".8"><path d="M40 22 L44 17 L62 22 L44 27 Z"/><path d="M0 22 L28 20.5 L40 22 L28 23.5 Z" fill="#5a4a35" stroke="none"/><circle cx="40" cy="22" r="7" fill="none"/><path d="M40 10 L42 20 L52 22 L42 24 L40 34 L38 24 L28 22 L38 20 Z"/></g></svg>';
  const menu = $('menu');
  ITEMS.forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'mi'; b.innerHTML = STAR + ORN_L + ORN_R + '<span></span>';

  });
  const paintMenu = () => [...menu.children].forEach((b, i) => { b.classList.toggle('on', i === sel); b.querySelector('span').textContent = t(ITEMS[i].k); });

  // ---------- controles: acciones del Classic Controller que usa el juego

    ls_right: { c: 'Left Stick/Right', n: L('DERECHA', 'MOVE RIGHT', 'DROITE') },

    rs_left: { c: 'Right Stick/Left', n: L('CÁMARA IZQ.', 'CAMERA LEFT', 'CAMÉRA GAUCHE') },

  const PAD_IDX = ['Button A', 'Button B', 'Button X', 'Button Y', 'Shoulder L', 'Shoulder R', 'Trigger L', 'Trigger R', 'Back', 'Start', 'Thumb L', 'Thumb R', 'Pad N', 'Pad S', 'Pad W', 'Pad E'];
  const PAD_SHOW = { 'Button A': 'A', 'Button B': 'B', 'Button X': 'X', 'Button Y': 'Y', 'Shoulder L': 'LB', 'Shoulder R': 'RB', 'Trigger L': 'LT', 'Trigger R': 'RT',

  const CODE2DI = (code) => {
    let m;

    if ((m = /^Digit(\d)$/.exec(code))) return m[1];
    if ((m = /^F(\d{1,2})$/.exec(code))) return 'F' + m[1];

    return ({ Space: 'SPACE', ShiftLeft: 'LSHIFT', ShiftRight: 'RSHIFT', ControlLeft: 'LCONTROL', ControlRight: 'RCONTROL', AltLeft: 'LMENU', AltRight: 'RMENU',

      NumpadMultiply: 'MULTIPLY', NumpadDivide: 'DIVIDE', NumpadDecimal: 'DECIMAL' })[code] || null;
  };
  const KB_SHOW = {

    };
    requestAnimationFrame(step);
    return { fade: (t) => { target = t; }, stop: () => { alive = false; ctx.clearRect(0, 0, W, H); } };
  };

  // ---------- intro: créditos HD → destello → revelado del menú
  const stage = $('stage'), intro = $('intro');
  const later = []; const at = (ms, fn) => later.push(setTimeout(fn, ms));
  let introDone = false, fx = null, motes = null;
  const revealMenu = (fast) => {
    stage.classList.add('beams-on');
    stage.classList.remove('boot');
    [...menu.children].forEach((b, i) => { b.style.transitionDelay = fast ? '0s' : (0.55 + i * 0.09) + 's'; });
    $('logo').style.transitionDelay = fast ? '0s' : '0.25s';
    ['bottom', 'hints'].forEach((id) => { $(id).style.transitionDelay = fast ? '0s' : '1.1s'; });
    document.querySelector('.winbtns').style.transitionDelay = fast ? '0s' : '1.1s';
    setTimeout(() => {
      [...menu.children].forEach((b) => { b.style.transitionDelay = ''; });
      ['logo', 'bottom', 'hints'].forEach((id) => { $(id).style.transitionDelay = ''; });
      document.querySelector('.winbtns').style.transitionDelay = '';
    }, 2500);
  };
  const finishIntro = () => {
    if (introDone) return; introDone = true;
    later.forEach(clearTimeout);
    if (fx) fx.stop();
    intro.classList.add('gone');
    $('flash').className = '';
    revealMenu(true);
    screen = 'main'; go('main');
  };
  const runIntro = () => {
    screen = 'intro';
    stage.classList.add('boot');
    fx = makeMotes($('fx'), 90, true);
    at(250, () => $('flare').classList.add('go'));
    at(700, () => intro.classList.add('p-splash'));
    at(2900, () => intro.classList.add('p-hold'));
    at(5600, () => { fx.fade(0); $('flash').className = 'on'; });
    at(5950, () => {
      intro.classList.add('out'); $('splash').style.opacity = '0'; $('splash').style.transition = 'none';
      $('flash').className = 'off';
      revealMenu(false);
    });
    at(7400, () => { if (!introDone) { introDone = true; fx.stop(); intro.classList.add('gone'); screen = 'main'; go('main'); } });
  };
  intro.addEventListener('click', finishIntro);
  motes = makeMotes($('motes'), 28, true);

  // ---------- viento: desplazamiento sutil de cabello, capas y cintas (WebGL)
  let windOn = () => {}, windToggle = () => {};
  (() => {
    const cv = $('artfx'); const gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true });
    if (!gl) return;
    const VS = 'attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}';
    const FS = `precision mediump float;varying vec2 uv;uniform sampler2D img,msk;uniform float t,amp;
      void main(){
        float m=texture2D(msk,uv).r;
        float gust=.7+.3*sin(t*.37)+.15*sin(t*.91+1.3);
        float w=sin(t*1.55+uv.y*8.5+uv.x*2.5)*.55+sin(t*2.6+uv.y*15.+uv.x*6.)*.28+sin(t*.8+uv.y*3.)*.35;
        float v=cos(t*1.9+uv.x*10.+uv.y*4.)*.25;
        vec2 d=vec2(w,v)*m*amp*gust*vec2(.0062,.0021);
        gl_FragColor=texture2D(img,uv-d);
      }`;
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
    let prog;
    try { prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); } catch (e) { console.warn('viento', e); return; }
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    const tex = (unit, img) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach((k) => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); };
    const load = (src) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
    const uT = gl.getUniformLocation(prog, 't'), uA = gl.getUniformLocation(prog, 'amp');
    Promise.all([load('assets/art.png'), load('assets/art_wind.png')]).then(([art, msk]) => {
      tex(0, art); tex(1, msk);
      gl.uniform1i(gl.getUniformLocation(prog, 'img'), 0); gl.uniform1i(gl.getUniformLocation(prog, 'msk'), 1);
      gl.viewport(0, 0, cv.width, cv.height);
      let amp = 0, t0 = performance.now(), running = false;
      const frame = (now) => {
        const target = cfg.wind === 'off' ? 0 : 1; amp += (target - amp) * 0.04;
        if (screen !== 'playing' && !document.hidden) {
          gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
          gl.uniform1f(uT, (now - t0) / 1000); gl.uniform1f(uA, amp); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }
        requestAnimationFrame(frame);
      };
      stage.classList.add('gl'); requestAnimationFrame(frame);
    }).catch((e) => console.warn('viento: no se cargaron las imágenes', e));
  })();

  // ---------- arranque
  paintMenu(); go('main'); runIntro();
  syncMusic();
  const kick = () => { syncMusic(); removeEventListener('pointerdown', kick); removeEventListener('keydown', kick); };
  addEventListener('pointerdown', kick); addEventListener('keydown', kick);
  if (host) send('init'); else applyLang();
})();
</script>
</body>
