<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logro</title>
<style>
@font-face{font-family:"TLS Cinzel";src:url(fonts/Cinzel.ttf) format("truetype");font-weight:400 900}
@font-face{font-family:"TLS Cormorant";src:url(fonts/CormorantGaramond.ttf) format("truetype");font-weight:300 700}
:root{--ink:#2e261c;--line:#8c7656;--blue:#3e5873;--gold:#d8b46a;--cream:#f8f1e1;
  --display:"TLS Cinzel","Cinzel",Georgia,serif;--body:"TLS Cormorant","Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;user-select:none;font-family:var(--body)}
#card{position:absolute;left:50%;top:18px;width:520px;height:108px;display:flex;align-items:center;gap:18px;padding:0 26px 0 18px;
  transform:translate(-50%,-150%);opacity:0;
  background:#efe3c8 url(assets/parchment.jpg) center/cover;border:1px solid var(--line);outline:1px solid rgba(140,118,86,.55);outline-offset:4px;
  box-shadow:0 0 0 1px rgba(255,236,190,.25),0 0 40px 8px rgba(255,214,140,.30),0 18px 40px rgba(0,0,0,.55)}
#card.in{animation:drop .75s cubic-bezier(.2,.9,.25,1.15) forwards}
#card.out{animation:rise .6s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes drop{from{transform:translate(-50%,-150%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-150%);opacity:0}}
/* destello que cruza la tarjeta */
#card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 35%,rgba(255,250,230,.75) 50%,transparent 65%);background-size:260% 100%;background-position:130% 0}
#card.in::after{animation:sweep 1.4s .55s ease-in-out forwards}
@keyframes sweep{to{background-position:-130% 0}}
.badge{position:relative;flex:none;width:72px;height:72px}
.badge img{width:72px;height:72px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 0 2px rgba(62,88,115,.9),0 0 18px 4px rgba(255,214,140,.65);object-fit:cover;background:var(--blue)}
.ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,230,170,.9);opacity:0}
#card.in .ring{animation:ring 1.1s .5s ease-out forwards}
@keyframes ring{0%{transform:scale(.7);opacity:.95}100%{transform:scale(1.5);opacity:0}}
.txt{flex:1;min-width:0}
.k{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:3px;color:var(--blue)}
.t{font-family:var(--display);font-size:19px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 1px}
.d{font-size:15px;font-style:italic;color:#5d4e3a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{flex:none;text-align:center;font-family:var(--display);color:var(--blue)}
.pts b{display:block;font-size:26px;line-height:1}
.pts span{font-size:10px;letter-spacing:2px}
</style>
</head>
<body>
<div id="card">
  <div class="badge"><img id="img" alt=""><div class="ring"></div></div>
  <div class="txt"><div class="k" id="k">LOGRO DESBLOQUEADO</div><div class="t" id="t"></div><div class="d" id="d"></div></div>
  <div class="pts"><b id="p">0</b><span id="pl">PTS</span></div>
</div>
<script>
(() => {
  const host = window.tlsHost;
  const $ = (id) => document.getElementById(id);
  const L = { es: ['LOGRO DESBLOQUEADO', 'PTS'], en: ['ACHIEVEMENT UNLOCKED', 'PTS'], fr: ['SUCCÈS DÉBLOQUÉ', 'PTS'] };
  const chime = new Audio('assets/sfx/start.ogg');
  const card = $('card');
  if (host) host.addEventListener('message', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type !== 'show') return;
    const a = m.data, l = L[a.lang] || L.es;
    $('k').textContent = l[0]; $('pl').textContent = l[1];
    $('t').textContent = a.title; $('d').textContent = a.description; $('p').textContent = a.points;
    $('img').src = a.badge || 'assets/icon.ico';
    card.className = ''; void card.offsetWidth; card.className = 'in';
    if (a.sound !== false) { try { chime.currentTime = 0; chime.volume = .5; chime.play().catch(() => {}); } catch (e) {} }
    clearTimeout(card._t);
    card._t = setTimeout(() => { card.className = 'out'; setTimeout(() => host.postMessage(JSON.stringify({ cmd: 'toastDone' })), 650); }, 5200);
  });
})();
</script>
</body>
</html>
